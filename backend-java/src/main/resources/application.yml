# Nova API Gateway Configuration

server:
  port: 8080

spring:
  application:
    name: nova-api-gateway
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:novadb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  # H2 Console for development
  h2:
    console:
      enabled: true
      path: /h2-console

# AI Service Configuration
ai-service:
  url: http://127.0.0.1:8002
  timeout: 30000

# CORS Configuration
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

# Logging
logging:
  level:
    nova: DEBUG
    org.springframework.web: INFO
